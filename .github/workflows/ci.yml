name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lwt:
    name: "Lwt (${{ matrix.os }}, OCaml ${{ matrix.ocaml-compiler }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ocaml-compiler: ['4.14', '5.2']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install system dependencies
        run: sudo apt-get install -y libssl-dev pkg-config

      - name: Install dependencies (packstream + bolt-lwt only)
        run: opam install ./neo4j_packstream.opam ./neo4j_bolt.opam --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build lib/packstream lib/lwt test

      - name: Run tests
        run: opam exec -- dune runtest

  build-eio:
    name: "Eio (${{ matrix.os }}, OCaml ${{ matrix.ocaml-compiler }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ['5.2']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libssl-dev pkg-config

      - name: Install dependencies (all packages)
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Run tests
        run: opam exec -- dune runtest
